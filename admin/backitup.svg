<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="BackItUp">
    <circle cx="32" cy="32" r="32" fill="#FF013E" />
    <g fill="none" stroke="#FFF" stroke-width="2">
        <!-- clock face: ring left open at the lower left, where the arrow head sits -->
        <path d="M12.29 30.1A19.8 19.8 0 1 1 17.4 45.38" stroke-width="4.3" />
        <!-- minute hand -->
        <path d="M32 16.6V32" />
        <!-- hour hand -->
        <path d="M32 32L40.1 40.1" stroke-linecap="round" />
    </g>
    <g fill="#FFF">
        <!-- arrow head, pointing counterclockwise -->
        <path d="M6.9 30H18.4L12.6 39.9Z" />
        <!-- hub -->
        <circle cx="32" cy="32" r="2.45" />
    </g>
</svg>
